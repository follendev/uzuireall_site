<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#000"><title>uzuireall</title><style>
*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;background:#000;color:#fff;font-family:Arial,sans-serif;overflow-x:hidden}body:before{content:"";position:fixed;inset:0;z-index:-3;background:linear-gradient(90deg,rgba(0,0,0,.94),rgba(0,0,0,.48),rgba(0,0,0,.9)),url('assets/fundo-spiderman.jpg') center/cover no-repeat;filter:grayscale(1) contrast(1.15);transform:scale(1.07)}body:after{content:"";position:fixed;inset:0;z-index:-2;background:radial-gradient(circle at center,transparent,rgba(0,0,0,.5) 60%,#000)}.wrap{min-height:100vh;display:grid;place-items:center;padding:25px 15px}.scene{perspective:1300px;width:min(430px,94vw)}.card{position:relative;min-height:650px;padding:35px 25px 28px;border:1px solid #ffffff22;border-radius:30px;overflow:hidden;transform-style:preserve-3d;background:linear-gradient(145deg,#ffffff14,#ffffff04);box-shadow:0 35px 100px #000d,inset 0 1px #fff2;backdrop-filter:blur(10px);transition:transform .12s ease}.card:before{content:"";position:absolute;inset:0;border-radius:30px;background:linear-gradient(125deg,#fff4,transparent 25%,transparent 70%,#fff1);pointer-events:none}.top{position:relative;z-index:2;display:flex;justify-content:space-between;margin-bottom:25px;color:#aaa;font-size:11px;letter-spacing:2px;text-transform:uppercase}.dot i{display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff;box-shadow:0 0 14px #fff;margin-right:7px}.mini{font-size:24px}.avatar-wrap{position:relative;z-index:3;width:165px;height:165px;margin:auto auto 22px;transform:translateZ(55px)}.avatar-wrap:before{content:"";position:absolute;inset:-10px;border:1px solid #fff3;border-radius:50%;box-shadow:0 0 40px #fff2;animation:pulse 3s infinite}.avatar{width:100%;height:100%;object-fit:cover;border-radius:50%;border:5px solid #090909;box-shadow:0 0 0 1px #fff4,0 20px 45px #000;filter:grayscale(1)}@keyframes pulse{50%{transform:scale(1.06);opacity:.4}}h1{position:relative;z-index:3;text-align:center;font-size:46px;letter-spacing:-2px;transform:translateZ(45px)}.handle{text-align:center;color:#888;font-size:12px;margin-top:8px;letter-spacing:2px}.bio{text-align:center;color:#ccc;line-height:1.6;font-size:14px;margin:19px auto 26px;max-width:290px;transform:translateZ(30px)}.links{position:relative;z-index:3;display:grid;gap:11px;transform:translateZ(35px)}.link{width:100%;display:flex;align-items:center;justify-content:space-between;text-decoration:none;color:#fff;padding:14px 16px;border:1px solid #fff2;border-radius:15px;background:#0008;transition:.25s;cursor:pointer}.link:hover{transform:translateY(-3px) scale(1.015);background:#fff1;border-color:#fff5}.left{display:flex;align-items:center;gap:12px;font-weight:700}.icon{width:30px;height:30px;border:1px solid #fff3;border-radius:9px;display:grid;place-items:center}.arrow{color:#888}.music{position:relative;z-index:3;margin-top:17px;padding:13px;border-radius:15px;border:1px solid #fff2;background:#0008;display:flex;align-items:center;gap:11px;transform:translateZ(28px)}.play{width:42px;height:42px;border-radius:50%;border:1px solid #fff4;background:#fff;color:#000;cursor:pointer;font-weight:bold}.music-info{flex:1;min-width:0}.music-title{font-weight:700;font-size:13px}.music-sub{font-size:11px;color:#888;margin-top:4px}.wave{display:flex;align-items:center;gap:3px}.wave span{width:2px;height:10px;background:#aaa;border-radius:5px;animation:wave 1s ease-in-out infinite}.wave span:nth-child(2){height:18px;animation-delay:.1s}.wave span:nth-child(3){height:13px;animation-delay:.2s}.wave span:nth-child(4){height:21px;animation-delay:.3s}.wave span:nth-child(5){height:9px;animation-delay:.4s}@keyframes wave{50%{transform:scaleY(.45);opacity:.45}}.footer{text-align:center;color:#666;font-size:10px;letter-spacing:3px;margin-top:20px}.hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);color:#777;font-size:10px;letter-spacing:1px}@media(max-width:500px){.card{min-height:620px;padding:28px 19px}.avatar-wrap{width:145px;height:145px}h1{font-size:40px}.hint{display:none}}
</style></head><body><main class="wrap"><div class="scene"><section class="card" id="card"><div class="top"><div><span class="dot"><i></i>online</span></div><div class="mini">♡</div></div><div class="avatar-wrap"><img class="avatar" src="assets/perfil-gato.jpg" alt="perfil"></div><h1>uzuireall</h1><div class="handle">@uzuireall</div><p class="bio">lost in my own world.<br>music • night • memories</p><div class="links"><a class="link" href="https://open.spotify.com/" target="_blank"><span class="left"><span class="icon">♫</span>Spotify</span><span class="arrow">↗</span></a><a class="link" href="https://www.tiktok.com/@uzuireall" target="_blank"><span class="left"><span class="icon">♪</span>TikTok</span><span class="arrow">↗</span></a><button class="link" id="discordBtn"><span class="left"><span class="icon">◉</span>Discord — sonicsad</span><span class="arrow">⧉</span></button></div><div class="music"><button class="play" id="play">▶</button><div class="music-info"><div class="music-title">minha música</div><div class="music-sub" id="status">clique para tocar</div></div><div class="wave"><span></span><span></span><span></span><span></span><span></span></div></div><div class="footer">uzuireall • 2026</div></section></div></main><div class="hint">MOVA O MOUSE SOBRE O CARD • 3D</div><audio id="audio" src="assets/musica.mp3" loop></audio><script>const c=document.getElementById('card');const a=document.querySelector('.avatar-wrap');c.addEventListener('mousemove',e=>{let r=c.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,rx=(y-r.height/2)/(r.height/2)*-7,ry=(x-r.width/2)/(r.width/2)*8;c.style.transform=`rotateX(${rx}deg) rotateY(${ry}deg) scale(1.015)`;a.style.transform=`translateZ(70px) rotateY(${ry*.35}deg)`});c.addEventListener('mouseleave',()=>{c.style.transform='';a.style.transform='translateZ(55px)'});const audio=document.getElementById('audio'),play=document.getElementById('play'),status=document.getElementById('status');play.onclick=()=>{if(audio.paused){audio.play().then(()=>{play.textContent='Ⅱ';status.textContent='tocando agora'}).catch(()=>status.textContent='clique novamente para tocar')}else{audio.pause();play.textContent='▶';status.textContent='pausada'}};document.getElementById('discordBtn').onclick=async()=>{try{await navigator.clipboard.writeText('sonicsad');status.textContent='Discord copiado: sonicsad'}catch{status.textContent='Discord: sonicsad'}};</script></body></html>
